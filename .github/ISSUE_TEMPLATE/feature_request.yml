name: Feature request
description: Suggest a template improvement (docs, scripts, prompts, scaffold, or CI policy).
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Keep requests focused on reusable template capabilities.
        Project-specific add-on requests should be implemented in your own extension repository.

  - type: checkboxes
    attributes:
      label: Pre-flight
      description: Please confirm before submitting.
      options:
        - label: I searched existing issues and did not find a similar request.
          required: true
        - label: This request is for the template itself.
          required: true
        - label: I understand this template should not accumulate project-specific `.tab` folders.
          required: true

  - type: dropdown
    attributes:
      label: Target area
      multiple: true
      options:
        - CodexWorkspace/human
        - CodexWorkspace/skills/.../references
        - CodexWorkspace/skills/.../assets
        - CodexWorkspace/workspace templates/structure
        - ai-pyrevit-developer-template.extension scaffold
        - Repo meta (GitHub, branch/CI, policy scripts)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem / motivation
      description: What problem are you solving and who benefits?
      placeholder: |
        As a ...
        I want ...
        So that ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: Describe the requested template change.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Other ways to solve this (including doing nothing).

  - type: input
    attributes:
      label: Success criteria
      description: How will we know this is done?
      placeholder: e.g. New guide linked from CodexWorkspace/human/README.md

  - type: checkboxes
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this (optional).
          required: false

  - type: textarea
    attributes:
      label: Additional context (optional)
      description: Links, screenshots, examples, prior art.
