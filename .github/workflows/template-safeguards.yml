name: Template Safeguards

on:
  pull_request:
  push:

jobs:
  template-safeguards:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify OOTB scaffold paths
        shell: pwsh
        run: ./tools/check_example_scaffold.ps1

      - name: Verify stale documentation paths
        shell: pwsh
        run: ./tools/check_stale_doc_paths.ps1
